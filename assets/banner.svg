<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -80; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 8px; opacity: 1; }
    }

    .bg-circle-1 { animation: pulseGlow 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .bg-circle-2 { animation: pulseGlow 10s infinite ease-in-out 2s; transform-origin: 1000px 220px; }
    .flow-line { stroke-dasharray: 8 8; animation: dashFlow 3s linear infinite; }
    .card-1 { animation: floatCard1 6s infinite ease-in-out; }
    .card-2 { animation: floatCard2 7s infinite ease-in-out 1s; }
    .node-dot { animation: nodePulse 3s infinite ease-in-out; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs -->
  <circle class="bg-circle-1" cx="150" cy="80" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="bg-circle-2" cx="1050" cy="240" r="200" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Stream Background Paths (Right Side Visuals) -->
  <g opacity="0.35">
    <path d="M 750,80 Q 900,20 1100,80" fill="none" stroke="url(#accentGrad1)" stroke-width="3" class="flow-line" />
    <path d="M 720,160 Q 920,240 1150,150" fill="none" stroke="url(#accentGrad2)" stroke-width="3" class="flow-line" />
    <path d="M 780,250 Q 950,120 1120,260" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Dynamic Decorative Cards (Positioned to NOT overlap foreground title text) -->
  <g class="card-1" transform="translate(820, 40)" filter="url(#shadow)">
    <rect width="150" height="65" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#6366f1" opacity="0.8" />
    <text x="42" y="29" fill="#e0e7ff" font-size="12" font-family="sans-serif" font-weight="600">Online Store</text>
    <text x="25" y="50" fill="#9ca3af" font-size="10" font-family="sans-serif">&lt; 10ms Latency</text>
  </g>

  <g class="card-2" transform="translate(990, 140)" filter="url(#shadow)">
    <rect width="160" height="65" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#10b981" opacity="0.8" />
    <text x="42" y="29" fill="#d1fae5" font-size="12" font-family="sans-serif" font-weight="600">Offline Store</text>
    <text x="25" y="50" fill="#9ca3af" font-size="10" font-family="sans-serif">Point-in-Time Join</text>
  </g>

  <g class="card-1" transform="translate(840, 220)" filter="url(#shadow)">
    <rect width="170" height="60" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="25" cy="22" r="10" fill="#ec4899" opacity="0.8" />
    <text x="42" y="26" fill="#fce7f3" font-size="12" font-family="sans-serif" font-weight="600">Feature Serving</text>
    <text x="25" y="46" fill="#9ca3af" font-size="10" font-family="sans-serif">Zero Training Skew</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Left Aligned, Clear Foreground) -->
  <g transform="translate(70, 0)">
    <!-- Category Tag / Pill -->
    <g transform="translate(0, 50)">
      <rect width="250" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="125" y="20" fill="#a5b4fc" font-size="12" class="title-text" text-anchor="middle" letter-spacing="1">MLOPS &amp; DATA INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="#ffffff" font-size="44" class="title-text" filter="url(#shadow)">
      Awesome Feature Store
    </text>

    <!-- Gradient Accent Line under title -->
    <rect x="0" y="152" width="520" height="4" rx="2" fill="url(#accentGrad1)" />

    <!-- Subtitle -->
    <text x="0" y="190" fill="#94a3b8" font-size="17" class="subtitle-text">
      Curated Catalog of Commercial SaaS &amp; Open-Source Feature Platforms
    </text>

    <!-- Sub-features Tags -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="70" y="18" fill="#cbd5e1" font-size="11" class="subtitle-text" text-anchor="middle">⚡ Real-Time Serving</text>

      <rect x="150" y="0" width="160" height="28" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="230" y="18" fill="#cbd5e1" font-size="11" class="subtitle-text" text-anchor="middle">🕒 Point-in-Time Joins</text>

      <rect x="320" y="0" width="150" height="28" rx="6" fill="#1f2937" stroke="#374151" />
      <text x="395" y="18" fill="#cbd5e1" font-size="11" class="subtitle-text" text-anchor="middle">🔒 Zero Skew Guarantees</text>
    </g>
  </g>
</svg>
